<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Canvas</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- state.js, input.js, and render.js use this canvas as the main view. -->
        <canvas id="c"></canvas>
        <!-- main.js keeps the simulation paused here until a start action is chosen. -->
        <div id="start-screen" class="start-screen">
            <section
                class="start-card"
                role="dialog"
                aria-modal="true"
                aria-labelledby="start-title"
            >
                <h1 id="start-title">Traffic Simulator</h1>
                <p>Build a better way.</p>
                <div class="start-actions">
                    <button id="resume-game" class="primary">
                        Resume Last Game
                    </button>
                    <button id="fresh-game">Start Fresh Game</button>
                    <button id="backup-game">Backup Current Game</button>
                    <button id="restore-game">Restore Backup</button>
                    <input
                        id="restore-file"
                        type="file"
                        accept="application/json,.json"
                        hidden
                    />
                </div>
                <p
                    id="start-message"
                    class="start-message"
                    aria-live="polite"
                ></p>
            </section>
        </div>
        <!-- input.js wires the speed, settings, Road/Traffic, and traffic-count controls. -->
        <div class="controls">
            <button
                id="speed"
                title="Normal speed (click for 2×)"
                aria-label="Simulation speed: normal"
            >
                ❯
            </button>

            <button
                id="mode-road"
                class="mode-button"
                aria-pressed="false"
                title="Build roads"
            >
                🛣️
            </button>
            <button
                id="mode-traffic"
                class="mode-button"
                aria-pressed="false"
                title="Manage traffic: click junctions for lights, roads for flow, cars and buildings for routes"
            >
                🚦
            </button>
            <button
                id="traffic-more"
                title="More traffic (+10%)"
                aria-label="Increase traffic by 10%"
            >
                &plus;
            </button>
            <button
                id="traffic-less"
                title="Less traffic (−10%)"
                aria-label="Decrease traffic by 10%"
            >
                &minus;
            </button>
            <button
                id="settings"
                title="Settings"
                aria-label="Settings"
                aria-expanded="false"
            >
                ⚙
            </button>
        </div>
        <!-- input.js opens/closes this menu and handles each settings action. -->
        <div id="settings-menu" class="settings" hidden>
            <div class="settings-stack" role="dialog" aria-label="Settings">
                <button id="snap">Snap: on</button>
                <button id="save">Save</button>
                <button id="reset">Reset</button>
                <button id="resume">Resume</button>
            </div>
        </div>
        <!-- inspect.js appends and dismisses traffic alert toasts here. -->
        <div id="toasts"></div>
        <!-- inspect.js fills this panel with junction or road details. -->
        <div id="panel" class="panel" hidden>
            <button class="panel-close" aria-label="Close">×</button>
            <div class="panel-title"></div>
            <div class="panel-body"></div>
        </div>
        <!-- input.js opens this menu and applies the selected road lane count. -->
        <div id="road-menu" class="menu" hidden>
            <div class="menu-title">New roads</div>
            <button data-lanes="1">2-lane road</button>
            <button data-lanes="2">4-lane road</button>
        </div>

        <!-- Plain scripts sharing one global scope, not modules, so the page still
        works opened straight from disk (file://). Order matters: main.js runs
        the startup code and must come last. -->
        <script src="js/state.js"></script>
        <script src="js/geometry.js"></script>
        <script src="js/terrain.js"></script>
        <script src="js/roads.js"></script>
        <script src="js/layout.js"></script>
        <script src="js/scenery.js"></script>
        <script src="js/traffic.js"></script>
        <script src="js/lights.js"></script>
        <script src="js/sim.js"></script>
        <script src="js/junctions.js"></script>
        <script src="js/vehicles.js"></script>
        <script src="js/render.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/inspect.js"></script>
        <script src="js/input.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
