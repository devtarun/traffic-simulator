<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .controls { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; }
  .controls button {
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc;
    background: #fafafa; cursor: pointer;
  }
  .controls button:hover { background: #eee; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="snap">Snap: on</button>
    <button id="save">Save</button>
    <button id="reset">Reset</button>
  </div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const STORAGE_KEY = 'canvas-state';
  const points = [];
  const lines = [];      // pairs of indices into points
  const RADIUS = 4;
  const ROAD_WIDTH = 24;
  const BOX_MIN = 40;    // boxes along roads are BOX_MIN to 2 × BOX_MIN wide
  const BOX_GAP = 20;    // space between neighbouring boxes
  const HIT = 20;        // pointer within this many px of a point snaps to it
  let last = null;       // index of the most recently clicked point
  let pointer = null;    // current pointer position, or null when outside
  let snap = true;       // new roads snap to horizontal/vertical when close to it
  const SNAP_ANGLE = 10; // degrees either side of horizontal/vertical that snap
  const view = { x: 0, y: 0, scale: 1 }; // screen = world × scale + (x, y), in CSS px
  const MIN_ZOOM = 0.1, MAX_ZOOM = 10;
  const DRAG = 4;        // pointer must move this many px before a press pans
  let drag = null;       // in-progress press: start position, view then, moved yet

  // Pointer position in CSS px relative to the canvas
  function screenPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // Pointer position in world coordinates, which points are stored in
  function pos(e) {
    const s = screenPos(e);
    return { x: (s.x - view.x) / view.scale, y: (s.y - view.y) / view.scale };
  }

  // HIT is in screen px, so snapping feels the same at any zoom
  function hitTest(p) {
    let best = null, bestDist = HIT / view.scale;
    points.forEach((q, i) => {
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d <= bestDist) { best = i; bestDist = d; }
    });
    return best;
  }

  // Offscreen layer for the preview road: drawn opaque, then composited at
  // half opacity, so its stacked passes don't show through each other.
  const layer = document.createElement('canvas');
  const lctx = layer.getContext('2d');

  function line(a, b, c = ctx) {
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  }

  // Draws segments ([p, q] pairs) as roads on context c. Each pass is drawn for
  // every road before the next, so overlapping roads merge into clean junctions
  // instead of one road's edge cutting across another.
  function roads(c, segs) {
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.setLineDash([]);
    [[ROAD_WIDTH, '#3a3a3a'], [ROAD_WIDTH - 4, '#f2f2f2'], [ROAD_WIDTH - 7, '#3a3a3a']].forEach(([w, color]) => {
      c.lineWidth = w;
      c.strokeStyle = color;
      segs.forEach(([p, q]) => line(p, q, c));
    });
    // Dashed center line, stopped short of the ends to keep junctions clear
    c.lineCap = 'butt';
    c.lineWidth = 2;
    c.strokeStyle = '#f5c518';
    c.setLineDash([10, 10]);
    segs.forEach(([p, q]) => {
      const len = Math.hypot(q.x - p.x, q.y - p.y);
      const t = ROAD_WIDTH / 2 / len;
      if (t >= 0.5) return;
      line({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t },
           { x: q.x - (q.x - p.x) * t, y: q.y - (q.y - p.y) * t }, c);
    });
    c.setLineDash([]);
    c.lineCap = 'butt';
    c.lineJoin = 'miter';
  }

  // Seeded PRNG (mulberry32), so a road's boxes are the same on every render
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash(...nums) {
    let h = 2166136261;
    nums.forEach(n => { h = Math.imul(h ^ Math.round(n), 16777619); });
    return h;
  }

  // Boxes are oriented rectangles: center c, unit axes u (along the road) and
  // n (across it), half-sizes hw and hd. local() maps a point into that frame.
  function local(b, p) {
    const dx = p.x - b.c.x, dy = p.y - b.c.y;
    return { x: dx * b.u.x + dy * b.u.y, y: dx * b.n.x + dy * b.n.y };
  }

  function corners(b) {
    return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([s, t]) => ({
      x: b.c.x + b.u.x * b.hw * s + b.n.x * b.hd * t,
      y: b.c.y + b.u.y * b.hw * s + b.n.y * b.hd * t,
    }));
  }

  function pointSegDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
    return Math.hypot(p.x - a.x - dx * t, p.y - a.y - dy * t);
  }

  // Distance from segment a–c to box b (0 if they intersect)
  function segBoxDist(b, a, c) {
    const la = local(b, a), lc = local(b, c);
    // Liang–Barsky clip of the segment against the box
    const dx = lc.x - la.x, dy = lc.y - la.y;
    let t0 = 0, t1 = 1, hit = true;
    for (const [p, q] of [[-dx, la.x + b.hw], [dx, b.hw - la.x], [-dy, la.y + b.hd], [dy, b.hd - la.y]]) {
      if (p === 0) { if (q < 0) hit = false; continue; }
      const r = q / p;
      if (p < 0) t0 = Math.max(t0, r); else t1 = Math.min(t1, r);
    }
    if (hit && t0 <= t1) return 0;
    const toBox = p => Math.hypot(Math.max(Math.abs(p.x) - b.hw, 0), Math.max(Math.abs(p.y) - b.hd, 0));
    return Math.min(toBox(la), toBox(lc), ...corners(b).map(k => pointSegDist(k, a, c)));
  }

  // Separating axis test for two boxes, with a margin between them
  function boxesOverlap(a, b, margin) {
    return [a.u, a.n, b.u, b.n].every(ax => {
      const proj = k => k.x * ax.x + k.y * ax.y;
      const pa = corners(a).map(proj), pb = corners(b).map(proj);
      return Math.min(...pa) < Math.max(...pb) + margin && Math.min(...pb) < Math.max(...pa) + margin;
    });
  }

  // Lays boxes along both sides of every road, left to right from CLEAR px
  // past each end, skipping any that would cover a road, a point or a box
  function layout() {
    const segs = lines.map(([a, b]) => [points[a], points[b]]);
    const placed = [];
    const CLEAR = ROAD_WIDTH, SETBACK = 4;
    segs.forEach(([p, q]) => {
      const L = Math.hypot(q.x - p.x, q.y - p.y);
      const u = { x: (q.x - p.x) / L, y: (q.y - p.y) / L };
      [1, -1].forEach(side => {
        const n = { x: -u.y * side, y: u.x * side };
        // Seed from the road's ends in a fixed order, so direction doesn't matter
        const [s, e] = p.x < q.x || (p.x === q.x && p.y < q.y) ? [p, q] : [q, p];
        const rand = rng(hash(s.x, s.y, e.x, e.y, side * (s === p ? 1 : -1)));
        for (let t = CLEAR; ; ) {
          const w = BOX_MIN + rand() * BOX_MIN, d = 20 + rand() * 20;
          if (t + w > L - CLEAR) break;
          const off = ROAD_WIDTH / 2 + SETBACK + d / 2;
          const box = {
            c: { x: p.x + u.x * (t + w / 2) + n.x * off, y: p.y + u.y * (t + w / 2) + n.y * off },
            u, n, hw: w / 2, hd: d / 2,
          };
          // Its own road sits exactly at min, so allow for rounding
          const min = ROAD_WIDTH / 2 + SETBACK - 0.5;
          const clear = segs.every(([a, c]) => segBoxDist(box, a, c) >= min)
            && points.every(pt => segBoxDist(box, pt, pt) >= min)
            && placed.every(o => !boxesOverlap(box, o, SETBACK));
          if (clear) placed.push(box);
          t += w + BOX_GAP;
        }
      });
    });
    return placed;
  }

  const ROOFS = [[12, 55, 48], [210, 12, 45], [25, 35, 40], [0, 45, 40], [100, 18, 40]]; // HSL
  const LIGHT = { x: -Math.SQRT1_2, y: -Math.SQRT1_2 }; // light from the top left

  function poly(pts) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
  }

  // Draws box b as a house seen from above: a hip roof whose four faces are
  // shaded by how much they face LIGHT, a drop shadow and maybe a chimney.
  // Colour and chimney are seeded from the box's position, so they're stable.
  function house(b) {
    const rand = rng(hash(b.c.x * 10, b.c.y * 10));
    const [h, s, l] = ROOFS[Math.floor(rand() * ROOFS.length)];
    // Long axis a with half-length L, short axis m with half-length S
    const [a, L, m, S] = b.hw >= b.hd ? [b.u, b.hw, b.n, b.hd] : [b.n, b.hd, b.u, b.hw];
    const at = (i, j) => ({ x: b.c.x + a.x * i + m.x * j, y: b.c.y + a.y * i + m.y * j });
    const r1 = at(-(L - S), 0), r2 = at(L - S, 0);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    poly(corners(b).map(p => ({ x: p.x + 3, y: p.y + 3 })));
    ctx.fill();

    ctx.strokeStyle = `hsl(${h}, ${s}%, ${l - 18}%)`;
    ctx.lineWidth = 1;
    ctx.lineJoin = 'round';
    [
      [[at(L, S), at(-L, S), r1, r2], m],
      [[at(L, -S), at(-L, -S), r1, r2], { x: -m.x, y: -m.y }],
      [[at(L, S), at(L, -S), r2], a],
      [[at(-L, S), at(-L, -S), r1], { x: -a.x, y: -a.y }],
    ].forEach(([pts, normal]) => {
      const lit = normal.x * LIGHT.x + normal.y * LIGHT.y;
      ctx.fillStyle = `hsl(${h}, ${s}%, ${l + lit * 12}%)`;
      poly(pts); ctx.fill(); ctx.stroke();
    });

    if (rand() < 0.5) {
      const k = Math.max(3, S * 0.35);
      const p = at((rand() - 0.5) * (L - S), (rand() < 0.5 ? 1 : -1) * S * 0.45);
      const box = { c: p, u: a, n: m, hw: k / 2, hd: k / 2 };
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      poly(corners(box).map(q => ({ x: q.x + 1.5, y: q.y + 1.5 })));
      ctx.fill();
      ctx.fillStyle = '#8a8580';
      ctx.strokeStyle = '#4a4744';
      poly(corners(box)); ctx.fill(); ctx.stroke();
    }
    ctx.lineJoin = 'miter';
  }

  // Boxes only change when the roads do, so cache them between renders
  let boxKey = '', boxes = [];
  function getBoxes() {
    const key = JSON.stringify([points, lines]);
    if (key !== boxKey) { boxKey = key; boxes = layout(); }
    return boxes;
  }

  function render() {
    // Clear and composite in device pixels; draw everything else in world coordinates
    const dpr = window.devicePixelRatio || 1;
    const toWorld = c => c.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    toWorld(ctx);
    getBoxes().forEach(house);
    roads(ctx, lines.map(([a, b]) => [points[a], points[b]]));
    if (last !== null && pointer) {
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.clearRect(0, 0, layer.width, layer.height);
      toWorld(lctx);
      roads(lctx, [[points[last], pointer]]);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 0.5;
      ctx.drawImage(layer, 0, 0);
      ctx.globalAlpha = 1;
      toWorld(ctx);
    }
    // Points stay the same size on screen at any zoom
    ctx.fillStyle = '#000';
    points.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, RADIUS / view.scale, 0, Math.PI * 2); ctx.fill();
    });
  }

  // Match the backing store to CSS size × devicePixelRatio so drawing stays sharp.
  // Resizing clears the canvas, so redraw everything afterwards.
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    layer.width = canvas.width;
    layer.height = canvas.height;
    render();
  }
  window.addEventListener('resize', resize);

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!s) return;
      points.push(...s.points);
      lines.push(...s.lines);
      last = s.last;
      if (s.view) Object.assign(view, s.view); // older saves have no view
    } catch (err) {
      console.warn('Could not load saved canvas', err);
    }
  }
  load();
  resize();

  function connect(a, b) {
    if (a === null || a === b) return;
    const exists = lines.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
    if (!exists) lines.push([a, b]);
  }

  // Removes point i and its lines, shifting later indices down to match
  function remove(i) {
    points.splice(i, 1);
    const kept = lines.filter(([a, b]) => a !== i && b !== i)
      .map(([a, b]) => [a > i ? a - 1 : a, b > i ? b - 1 : b]);
    lines.length = 0;
    lines.push(...kept);
    if (last === i) last = null;
    else if (last > i) last--;
  }

  // Where a click at p lands: an existing point within HIT px if there is one,
  // otherwise, with snapping on, p moved onto the horizontal or vertical
  // through last when the road from last is within SNAP_ANGLE of it
  function target(p) {
    const i = hitTest(p);
    if (i !== null) return { p: points[i], i };
    if (!snap || last === null) return { p, i: null };
    const o = points[last];
    const dx = Math.abs(p.x - o.x), dy = Math.abs(p.y - o.y);
    const off = Math.atan2(Math.min(dx, dy), Math.max(dx, dy)) * 180 / Math.PI;
    if (off > SNAP_ANGLE) return { p, i: null };
    return dx > dy
      ? { p: { x: p.x, y: o.y }, i: null }
      : { p: { x: o.x, y: p.y }, i: null };
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', e => {
    // Right click on a point removes it; elsewhere it ends the current chain
    if (e.button === 2) {
      const i = hitTest(pos(e));
      if (i === null) last = null;
      else {
        const n = lines.filter(([a, b]) => a === i || b === i).length;
        if (!confirm(`Remove this point${n ? ` and its ${n} road${n > 1 ? 's' : ''}` : ''}?`)) return;
        remove(i);
        pointer = pos(e);
      }
      render();
      return;
    }
    // Left or middle press: a drag pans the view; a left click adds a point on release
    if (e.button !== 0 && e.button !== 1) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drag = { button: e.button, start: screenPos(e), view: { ...view }, moved: false };
  });
  canvas.addEventListener('pointermove', e => {
    if (drag) {
      const s = screenPos(e);
      const dx = s.x - drag.start.x, dy = s.y - drag.start.y;
      if (!drag.moved && Math.hypot(dx, dy) > DRAG) {
        drag.moved = true;
        canvas.style.cursor = 'grabbing';
      }
      if (drag.moved) { view.x = drag.view.x + dx; view.y = drag.view.y + dy; }
    }
    pointer = target(pos(e)).p;
    render();
  });
  canvas.addEventListener('pointerup', e => {
    if (!drag) return;
    const click = drag.button === 0 && !drag.moved;
    drag = null;
    canvas.style.cursor = '';
    if (!click) return;
    let { p, i } = target(pos(e));
    if (i === null) { points.push(p); i = points.length - 1; }
    connect(last, i);
    last = i;
    pointer = points[i];
    render();
  });
  canvas.addEventListener('pointercancel', () => { drag = null; canvas.style.cursor = ''; });

  // Wheel zooms around the pointer: the world point under it stays put
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const s = screenPos(e);
    const delta = e.deltaY * (e.deltaMode === 1 ? 16 : 1); // lines → px
    const scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, view.scale * Math.exp(-delta * 0.0015)));
    view.x = s.x - (s.x - view.x) * scale / view.scale;
    view.y = s.y - (s.y - view.y) * scale / view.scale;
    view.scale = scale;
    pointer = target(pos(e)).p;
    render();
  }, { passive: false });
  canvas.addEventListener('pointerleave', () => { pointer = null; render(); });

  const snapBtn = document.getElementById('snap');
  snapBtn.onclick = () => {
    snap = !snap;
    snapBtn.textContent = `Snap: ${snap ? 'on' : 'off'}`;
  };

  document.getElementById('reset').onclick = () => {
    points.length = 0; lines.length = 0; last = null;
    render();
  };

  const saveBtn = document.getElementById('save');
  saveBtn.onclick = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ points, lines, last, view }));
      saveBtn.textContent = 'Saved';
    } catch (err) {
      console.warn('Could not save canvas', err);
      saveBtn.textContent = 'Save failed';
    }
    setTimeout(() => { saveBtn.textContent = 'Save'; }, 1200);
  };
</script>
</body>
</html>
